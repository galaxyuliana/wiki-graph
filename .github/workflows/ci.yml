name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifests are valid JSON
        run: |
          python - <<'EOF'
          import json
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json",
                    "hooks/hooks.json"):
              json.load(open(p))
              print("ok", p)
          EOF
      - name: Demo wiki has no broken links
        run: python build.py examples/demo-wiki /tmp/out --check
